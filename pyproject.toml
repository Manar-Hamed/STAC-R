[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stacr"
version = "0.2.0"
description = "Subspace-Tracked Activation Compression with Residuals for PyTorch"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE.txt"]
authors = [{name = "Manar Hamed"}, {name = "Yassine Yaakoubi"}]
dependencies = ["torch>=2.4", "numpy>=1.24", "PyYAML>=6"]

[project.urls]
Repository = "https://github.com/Manar-Hamed/STAC-R"

[project.optional-dependencies]
train = ["transformers>=4.51,<5", "datasets>=3,<5", "accelerate>=1"]
benchmarks = ["transformers>=4.51,<5", "datasets>=3,<5", "accelerate>=1", "pandas>=2", "matplotlib>=3.7", "psutil>=5.9", "nvidia-ml-py>=12", "tensorly>=0.8"]
peft = ["peft>=0.15,<1", "bitsandbytes>=0.45"]
comparators = ["bitsandbytes>=0.45", "accelerate>=1", "evaluate>=0.4", "scipy>=1.10", "scikit-learn>=1.3", "peft>=0.15,<1", "matplotlib>=3.7"]
galore = ["galore-torch>=1.0"]
graph = ["torch-geometric>=2.6", "ogb>=1.3.6"]
test = ["pytest>=8", "build>=1"]

[project.scripts]
stacr = "stacr.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["stacr*", "comparators*", "experiments*", "paper_data*", "configs*", "scripts*"]

[tool.setuptools.package-data]
configs = ["*.yaml", "*.json"]
paper_data = ["*.csv", "results/*.csv", "results/*.jsonl"]
comparators = ["*.txt", "instant/*.txt", "instant/*/LICENSE*", "instant/LICENSE*", "instant/REVISION*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
markers = ["cuda: requires a CUDA device", "integration: exercises a model or external dependency"]

[tool.ruff]
line-length = 100
target-version = "py310"
